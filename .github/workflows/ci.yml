name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1" # Mondays: every engine test under ASan (asan-full)
  workflow_dispatch:

# Shared runners can't time the latency gates reliably: run them locally
# on real hardware (DESIGN §9). Allocation and mispredict gates still run.
env:
  SHIXIN_PERF_TOLERANCE: "off"

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: amd64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Windows frontend/backend build and native tests
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Arch ${{ matrix.arch }} -Check
      - name: Windows llama ABI and unavailable-GPU fallback
        shell: pwsh
        run: ./scripts/build-llama.ps1 -Arch ${{ matrix.arch }} -NoVulkan -Test
      - name: Unsigned preview isolation and manual updates
        shell: pwsh
        run: go test -short -tags shixin_unsigned_preview ./internal/winsetup ./cmd/shixin-setup ./cmd/shixin ./cmd/shixin-settings
      # Go 1.27 supports Windows race instrumentation on amd64, not arm64.
      - name: Go race detector (x64, all packages)
        if: matrix.arch == 'amd64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = Get-Command gcc -ErrorAction SilentlyContinue
          if (-not $compiler) {
            foreach ($candidate in @('C:\msys64\ucrt64\bin\gcc.exe', 'C:\msys64\mingw64\bin\gcc.exe', 'C:\mingw64\bin\gcc.exe')) {
              if (Test-Path $candidate) { $compiler = Get-Item $candidate; break }
            }
          }
          if (-not $compiler) { throw 'Windows x64 race tests require MinGW-w64 GCC' }
          $compilerPath = if ($compiler.Source) { $compiler.Source } else { $compiler.FullName }
          $env:CC = $compilerPath
          $env:PATH = "$(Split-Path $compilerPath -Parent);$env:PATH"
          $env:CGO_ENABLED = '1'
          go test -race -p 1 -short -timeout 5m ./...
          if ($LASTEXITCODE -ne 0) { throw 'Go race tests failed' }

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: librime for engine tests
        run: sudo apt-get update && sudo apt-get install -y librime1 librime-data clang
      - run: scripts/ci.sh go
      - name: Native client policy, codecs, queues, and allocation tests
        run: |
          cmake -S frontends/windows-tsf -B build/tsf-tests -DCMAKE_BUILD_TYPE=Release
          cmake --build build/tsf-tests
          ctest --test-dir build/tsf-tests --output-on-failure
      - run: scripts/ci.sh fuzz

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: brew install cmake ninja
      - id: keys
        name: cache keys
        run: |
          echo "llama=$(git rev-parse HEAD:third_party/llama.cpp)" >>"$GITHUB_OUTPUT"
          echo "week=$(date -u +%G-%V)" >>"$GITHUB_OUTPUT"
      - name: cache librime dependencies and Boost
        uses: actions/cache@v6
        with:
          path: |
            build/librime/src/lib
            build/librime/src/include
            build/librime/src/share
            build/librime/src/deps/boost-*
          key: librime-deps-${{ runner.os }}-${{ hashFiles('.gitmodules', 'scripts/build-librime.sh') }}-${{ github.sha }}
          restore-keys: librime-deps-${{ runner.os }}-${{ hashFiles('.gitmodules', 'scripts/build-librime.sh') }}-
      # build-llama.sh skips the build when the stamp matches the pinned commit.
      - name: cache llama.cpp
        uses: actions/cache@v6
        with:
          path: build/llama/lib
          key: llama-${{ runner.os }}-${{ steps.keys.outputs.llama }}-${{ hashFiles('scripts/build-llama.sh') }}
      # rime-ice is a nightly; refresh it weekly.
      - name: cache rime-ice
        uses: actions/cache@v6
        with:
          path: build/rime-data
          key: rime-data-${{ steps.keys.outputs.week }}-${{ hashFiles('scripts/fetch-rime-data.sh') }}
      - run: scripts/ci.sh macos

  macos-asan:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: brew install cmake ninja
      - id: keys
        name: cache keys
        run: echo "week=$(date -u +%G-%V)" >>"$GITHUB_OUTPUT"
      - name: cache librime dependencies and Boost
        uses: actions/cache@v6
        with:
          path: |
            build/librime/src/lib
            build/librime/src/include
            build/librime/src/share
            build/librime/src/deps/boost-*
          key: librime-deps-${{ runner.os }}-${{ hashFiles('.gitmodules', 'scripts/build-librime.sh') }}-${{ github.sha }}
          restore-keys: librime-deps-${{ runner.os }}-${{ hashFiles('.gitmodules', 'scripts/build-librime.sh') }}-
      - name: cache rime-ice
        uses: actions/cache@v6
        with:
          path: build/rime-data
          key: rime-data-${{ steps.keys.outputs.week }}-${{ hashFiles('scripts/fetch-rime-data.sh') }}
      - run: scripts/ci.sh ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'asan-full' || 'asan' }}
