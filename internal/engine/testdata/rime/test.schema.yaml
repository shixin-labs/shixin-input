schema:
  schema_id: test
  name: Test
  version: "1"
switches:
  - name: ascii_mode
    reset: 0
  - name: full_shape
    reset: 0
engine:
  processors: [shixin_rerank_processor, shixin_select_character, ascii_composer, recognizer, key_binder, speller, punctuator, selector, navigator, express_editor]
  segmentors: [ascii_segmentor, matcher, abc_segmentor, punct_segmentor, fallback_segmentor]
  translators: [punct_translator, script_translator]
  filters: [shixin_rerank, uniquifier]
speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
translator:
  dictionary: test
  enable_user_dict: true
punctuator:
  half_shape:
    ",": "，"
    ".": "。"
    "/": ["/", "÷", "、"]
ascii_composer:
  good_old_caps_lock: true
  switch_key:
    Shift_L: commit_code
    Shift_R: commit_code
    Control_L: noop
    Control_R: noop
    Caps_Lock: clear
    Eisu_toggle: clear
key_binder:
  select_first_character: bracketleft
  select_last_character: bracketright
  bindings:
    - {when: has_menu, accept: minus, send: Page_Up}
    - {when: has_menu, accept: equal, send: Page_Down}
    - {when: always, accept: Control+period, toggle: ascii_punct}
recognizer:
  patterns:
    email: "^[A-Za-z][-_.0-9A-Za-z]*@.*$"
menu:
  page_size: 5
